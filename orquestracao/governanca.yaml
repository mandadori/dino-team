# Governança — mapa de autonomia por decisão (Dino Team)
# "A governança é propriedade de cada decisão" (spec §4.5).
# Este arquivo CONSOLIDA os flags; políticas específicas (ex: publicação) vivem em arquivos próprios.
# Versão: 1
versao: 1

decisoes:
  - funcao: estrategia-mercado
    decisao: "que verdade da marca responde ao momento (emoção do público + crença de mercado)"
    autonomia: automatico_com_revisao   # propor jogadas = auto; ajuste de temas = humano no modo manual da pauta
    corpo: "agente estrategista-mercado (na /planejar-pauta-semanal)"

  - funcao: coerencia-verdade
    decisao: "a jogada serve ou contradiz uma verdade da marca"
    autonomia: automatico                # flag; ação humana só se 'contradiz'/'off-brand'
    corpo: "estrategista-mercado (check na pauta)"

  - funcao: planejamento-pauta
    decisao: "o que produzir na janela, p/ qual verdade"
    autonomia: automatico_com_revisao
    corpo: "/planejar-pauta-semanal"

  - funcao: pesquisa-mercado
    decisao: "o que no nicho importa"
    autonomia: automatico                # cron + demanda
    corpo: "agente pesquisador-mercado + /pesquisar-mercado"

  - funcao: producao-conteudo
    decisao: "produzir a peça no canal X"
    autonomia: humano                    # gate de marca sempre; publicação ver politica
    corpo: "/novo-post, /novo-artigo, /novo-email, /novo-comunidade"
    politica: orquestracao/politicas/publicacao.yaml

  - funcao: publicacao
    decisao: "publicar o artefato pronto"
    autonomia: ver_politica
    politica: orquestracao/politicas/publicacao.yaml

  - funcao: guarda-marca-compliance
    decisao: "dentro da identidade + compliance"
    autonomia: automatico                # gate determinístico (aprovado/reprovado)
    corpo: "agente revisor-brand"

  - funcao: aprimoramento-branding
    decisao: "o brand book precisa evoluir"
    autonomia: humano
    corpo: "/brand-discovery, /afinar-tom-de-voz + revisor-brand"

  - funcao: aprendizado-performance
    decisao: "o que performou/saturou"
    autonomia: automatico
    corpo: "agente analista-performance"

  - funcao: desenvolvimento-produto
    decisao: "descobrir oportunidade no cérebro + arquitetar a oferta"
    autonomia: automatico_com_revisao   # propor/desenhar = auto; criar de fato passa pelos gates abaixo
    corpo: "agente estrategista-produto (/criar-produto)"

  - funcao: validacao-produto
    decisao: "rodar experimento barato dentro do orçamento (G-ideia)"
    autonomia: automatico_com_revisao   # libera validar = humano no G-ideia; experimento roda na audiência
    corpo: "/validar-produto"

  - funcao: lancamento-produto
    decisao: "construir + precificar + distribuir o produto validado (G-lançamento consolidado)"
    autonomia: humano                    # gate único de lançamento; nada executa sem go/no-go
    corpo: "/validar-produto (G-lançamento) → handoff p/ marketing"

  - funcao: sunset-produto
    decisao: "aposentar um produto (G-sunset)"
    autonomia: humano                    # matar produto exige confirmação; custo afundado ignorado na recomendação
    corpo: "/evoluir-produto (G-sunset)"

# Regra-mãe (nunca relaxar): publicar como fallback de timeout é PROIBIDO (ver publicacao.yaml).
