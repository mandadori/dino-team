# Rotas declarativas — Dino Team
# AGENDAMENTO: executado por routines /schedule (ver docs/automacao/routines.md).
# Este arquivo é a documentação declarativa que as routines espelham.
# Versão: 1

rotas:
  - id: pauta-semanal-cron
    trigger:
      tipo: cron
      schedule: "0 9 * * 1"          # toda 2ª-feira 9h (TZ: America/Sao_Paulo)
      timezone: America/Sao_Paulo
    skill: /planejar-pauta-semanal
    args:
      N: 5
    notificacao:
      sucesso: dashboard              # registra em campanhas/.../log.md; dashboard mostra
      falha: dashboard
    ativa: true

  - id: pesquisar-mercado-cron
    trigger:
      tipo: cron
      schedule: "0 8 1 * *"          # dia 1 de cada mês às 8h (TZ: America/Sao_Paulo)
      timezone: America/Sao_Paulo
    skill: /pesquisar-mercado
    args:
      mes: auto
    notificacao:
      sucesso: dashboard
      falha: dashboard
    ativa: true

  - id: evolucao-produto-cron
    trigger:
      tipo: cron
      schedule: "0 9 5 * *"          # dia 5 de cada mês às 9h (TZ: America/Sao_Paulo)
      timezone: America/Sao_Paulo
    skill: /evoluir-produto
    args:
      escopo: --todos                 # varre todos os produtos ativos; SÓ sinaliza, humano decide
    notificacao:
      sucesso: dashboard
      falha: dashboard
    ativa: true
