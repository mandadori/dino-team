<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide 1 — Capa — Dino Team / treino-dino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #7f7f7f;
      --color-chroma: #00b140;
      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;
      --pad: 80px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--color-fg);
    }
    .slide-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center top;
      background-color: #1a1a1a;
    }
    .slide-bg.placeholder {
      background-image: repeating-linear-gradient(
        45deg, #1a1a1a 0 24px, #222 24px 48px
      );
    }
    .img-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,0) 28%,
        rgba(0,0,0,0) 45%,
        rgba(0,0,0,.80) 100%
      );
    }
    .topbar {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      right: var(--pad);
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
    }
    .topbar .logo-img {
      height: 32px;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
      opacity: 0.98;
    }
    .topbar .topic {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 5px rgba(0,0,0,.5);
    }
    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 36px 80px 56px;
      z-index: 5;
    }
    .progress .track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.22);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }
    /* VARIANTE CAPA */
    .slide.capa .title-block {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 110px;
      z-index: 3;
    }
    .slide.capa .big-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 148px;
      line-height: 0.92;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,.45);
    }
    .slide.capa .swipe-cue {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 5px rgba(0,0,0,.4);
    }
    .slide.capa .swipe-cue svg {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>
  <section class="slide capa">
    <div class="slide-bg placeholder"></div>
    <div class="img-overlay"></div>

    <div class="topbar">
      <img src="/Users/unstudio/Documents/Projetos/dino team/brand/assets/logo.png" alt="DINO" class="logo-img" />
      <span class="topic">LEG DAY</span>
    </div>

    <div class="title-block">
      <h1 class="big-title">FAÇA ESSE<br />TREINO E<br />NÃO ANDE<br />MAIS</h1>
      <div class="swipe-cue">
        <span>Arraste</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" style="width: 12.5%"></div></div>
    </div>
  </section>
</body>
</html>
