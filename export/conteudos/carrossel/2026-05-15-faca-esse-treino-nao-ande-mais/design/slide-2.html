<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide 2 — O Treino — Dino Team / treino-dino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #7f7f7f;
      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;
      --pad: 80px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--color-fg);
    }
    .slide-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a;
    }
    .slide-bg.placeholder {
      background-image: repeating-linear-gradient(
        45deg, #1a1a1a 0 24px, #222 24px 48px
      );
    }
    .img-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.65) 0%,
        rgba(0,0,0,.55) 100%
      );
    }
    .topbar {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      right: var(--pad);
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
    }
    .topbar .logo-img {
      height: 32px;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
      opacity: 0.98;
    }
    .topbar .topic {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 5px rgba(0,0,0,.5);
    }
    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 36px 80px 56px;
      z-index: 5;
    }
    .progress .track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.22);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }
    /* VARIANTE LISTA */
    .slide.lista .lista-content {
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 180px var(--pad) 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .slide.lista .ex-list {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }
    .slide.lista .ex-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slide.lista .ex-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 30px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.1;
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    .slide.lista .ex-name .code {
      margin-right: 10px;
      color: rgba(255,255,255,.7);
    }
    .slide.lista .ex-reps {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 24px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,.85);
      text-shadow: 0 2px 5px rgba(0,0,0,.4);
      display: flex;
      align-items: baseline;
      gap: 24px;
    }
    .slide.lista .ex-reps .sets {
      min-width: 140px;
      font-weight: 600;
      color: rgba(255,255,255,.95);
    }
    .slide.lista .ex-reps .reps {
      display: flex;
      gap: 14px;
    }
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,.15);
      margin: 4px 0 2px;
    }
  </style>
</head>
<body>
  <section class="slide lista">
    <div class="slide-bg placeholder"></div>
    <div class="img-overlay"></div>

    <div class="topbar">
      <img src="/Users/unstudio/Documents/Projetos/dino team/brand/assets/logo.png" alt="DINO" class="logo-img" />
      <span class="topic">O TREINO</span>
    </div>

    <div class="lista-content">
      <div class="ex-list">

        <div class="ex-item">
          <div class="ex-name"><span class="code">A1.</span>ABDUTORA NA MÁQUINA</div>
          <div class="ex-reps">
            <span class="sets">4 SÉRIES</span>
            <span class="reps"><span>15</span><span>·</span><span>12</span><span>·</span><span>Ⓕ</span><span>·</span><span>Ⓕ</span></span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="ex-item">
          <div class="ex-name"><span class="code">B1.</span>AGACHAMENTO LIVRE</div>
          <div class="ex-reps">
            <span class="sets">4 SÉRIES</span>
            <span class="reps"><span>10</span><span>·</span><span>8</span><span>·</span><span>8</span><span>·</span><span>Ⓕ</span></span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="ex-item">
          <div class="ex-name"><span class="code">C1.</span>LEG PRESS 45</div>
          <div class="ex-reps">
            <span class="sets">4 SÉRIES</span>
            <span class="reps"><span>12</span><span>·</span><span>10</span><span>·</span><span>Ⓕ</span><span>·</span><span>Ⓕ</span></span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="ex-item">
          <div class="ex-name"><span class="code">D1.</span>CADEIRA EXTENSORA</div>
          <div class="ex-reps">
            <span class="sets">3 SÉRIES</span>
            <span class="reps"><span>15</span><span>·</span><span>12</span><span>·</span><span>Ⓕ</span></span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="ex-item">
          <div class="ex-name"><span class="code">E1.</span>CADEIRA FLEXORA</div>
          <div class="ex-reps">
            <span class="sets">3 SÉRIES</span>
            <span class="reps"><span>12</span><span>·</span><span>10</span><span>·</span><span>Ⓕ</span></span>
          </div>
        </div>

      </div>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" style="width: 25%"></div></div>
    </div>
  </section>
</body>
</html>
