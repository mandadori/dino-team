<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide 8 — CTA Final — Dino Team / treino-dino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;
      --pad: 80px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--color-fg); }
    .slide-bg {
      position: absolute; inset: 0; z-index: 0;
      background-size: cover; background-position: center;
      background-color: #1a1a1a;
    }
    .slide-bg.placeholder {
      background-image: repeating-linear-gradient(45deg, #1a1a1a 0 24px, #222 24px 48px);
    }
    .img-overlay {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,.6) 0%, rgba(0,0,0,.45) 40%, rgba(0,0,0,.75) 100%);
    }
    .topbar {
      position: absolute; top: var(--pad); left: var(--pad); right: var(--pad);
      height: 40px; display: flex; justify-content: space-between; align-items: center; z-index: 4;
    }
    .topbar .logo-img { height: 32px; width: auto; display: block; filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); opacity: 0.98; }
    .topbar .topic {
      font-family: var(--font-body); font-size: 14px; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,.92); text-shadow: 0 2px 5px rgba(0,0,0,.5);
    }
    .progress {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 80px 56px; z-index: 5;
    }
    .progress .track { width: 100%; height: 3px; background: rgba(255,255,255,.22); border-radius: 2px; overflow: hidden; }
    .progress .fill { height: 100%; background: #ffffff; border-radius: 2px; }
    /* VARIANTE CTA */
    .slide.cta .cta-block {
      position: absolute;
      left: var(--pad); right: var(--pad);
      top: 0; bottom: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      gap: 32px;
    }
    .slide.cta .big-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 130px;
      line-height: 0.95;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,.5);
    }
    .slide.cta .cta-sub {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.85);
      text-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <section class="slide cta">
    <div class="slide-bg placeholder"></div>
    <div class="img-overlay"></div>

    <div class="topbar">
      <img src="/Users/unstudio/Documents/Projetos/dino team/brand/assets/logo.png" alt="DINO" class="logo-img" />
      <span class="topic">DIRECIONE SEU ESFORÇO</span>
    </div>

    <div class="cta-block">
      <h1 class="big-title">SEU TREINO<br />TEM MÉTODO<br />OU TEM<br />SORTE?</h1>
      <p class="cta-sub">ENTRE PARA A DINO TEAM. LINK NA BIO.</p>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" style="width: 100%"></div></div>
    </div>
  </section>
</body>
</html>
