<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide 1 — Capa — Treino de Pernas Completo (treino-dino)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ESTILO: treino-dino | CONCEITO: treino real do campeão — P&B fotográfico com chroma verde nos exercícios */

    /* ====================================================================
       BRAND DINO TEAM — Estilo treino-dino — carrossel 4:5 (1080x1350)

       Variantes (escolha uma na <section class="slide ...">):
         .slide.capa      → slide 1: foto Ramon + título grande + swipe cue
         .slide.lista     → slide 2: foto Ramon + lista de exercícios
         .slide.exercicio → slides 3 a N+2: chroma verde + canto com exercício
         .slide.cta       → slide final: foto Ramon + frase centralizada

       Tokens: paleta P&B + cinza, chroma green funcional, Anton + Montserrat
       Margem padrão: 80px. Não altere width/height.
    ==================================================================== */
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #7f7f7f;
      --color-chroma: #00b140;

      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;

      --pad: 80px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--color-fg);
    }

    /* --------- Background fotográfico (capa, lista, cta) --------- */
    .slide-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a;
    }
    .slide-bg.placeholder {
      background-image: repeating-linear-gradient(
        45deg, #1a1a1a 0 24px, #222 24px 48px
      );
    }
    .img-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.55) 0%,
        rgba(0,0,0,0) 28%,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.7) 100%
      );
    }

    /* --------- Chroma key (slides de exercício) --------- */
    .chroma-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--color-chroma);
    }

    /* --------- Topbar (logo + tag de tópico) --------- */
    .topbar {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      right: var(--pad);
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
    }
    .topbar .logo-img {
      height: 32px;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
      opacity: 0.98;
    }
    .topbar .topic {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 5px rgba(0,0,0,.5);
    }

    /* Em chroma, sem drop-shadow / text-shadow para não vazar verde */
    .slide.exercicio .topbar .logo-img,
    .slide.exercicio .topbar .topic,
    .slide.exercicio .exercise-corner * {
      filter: none;
      text-shadow: none;
    }

    /* --------- Barra de progresso (todos os slides) --------- */
    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 36px 80px 56px;
      z-index: 5;
    }
    .progress .track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.22);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    /* ============ VARIANTE: capa ============ */
    .slide.capa .title-block {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 110px;
      z-index: 3;
    }
    .slide.capa .big-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 160px;
      line-height: 0.92;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,.45);
    }
    .slide.capa .subtitle {
      margin-top: 20px;
      font-family: var(--font-body);
      font-size: 24px;
      font-weight: 300;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: rgba(255,255,255,.70);
      text-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .slide.capa .swipe-cue {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 5px rgba(0,0,0,.4);
    }
    .slide.capa .swipe-cue svg {
      width: 26px;
      height: 26px;
    }
  </style>
</head>
<body>
  <section class="slide capa">
    <div class="slide-bg placeholder" data-bg-drop="photo"></div>
    <div class="img-overlay"></div>

    <div class="topbar">
      <img src="../../../../../brand/assets/logo.png" alt="DINO" class="logo-img" />
      <span class="topic">LEG DAY</span>
    </div>

    <div class="title-block">
      <h1 class="big-title">TREINO DE<br />PERNAS DO<br />CAMPEÃO</h1>
      <p class="subtitle">Ramon Dino — Mr. Olympia Classic Physique 2025</p>
      <div class="swipe-cue">
        <span>ARRASTE</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
    </div>

    <div class="progress">
      <div class="track"><div class="fill" style="width: 12.5%"></div></div>
    </div>
  </section>
</body>
</html>
