<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Preview — estilo _rascunho (carrossel)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Wrapper Dino Team: carrossel arrastável + drop de imagem + reposicionamento */
    html, body { margin: 0; padding: 0; background: #111; overscroll-behavior: none; }

    .dt-carousel {
      display: flex; align-items: center; gap: 40px; padding: 0 40px;
      overflow-x: auto; overflow-y: hidden; height: 100vh;
      scroll-snap-type: x mandatory; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .dt-carousel::-webkit-scrollbar { display: none; }

    section[data-slide] {
      flex-shrink: 0; scroll-snap-align: center; position: relative;
      overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6);
    }

    [data-bg-drop].dt-drop-active { outline: 6px dashed #00b140; outline-offset: -6px; }
    [data-bg-drop][data-has-bg] { cursor: grab; }
    [data-bg-drop][data-has-bg].dt-grabbing { cursor: grabbing; }

    .dt-controls {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px; padding: 10px 18px;
      background: rgba(0,0,0,.72); backdrop-filter: blur(10px);
      border-radius: 999px; font-family: "Montserrat", sans-serif;
      color: #fff; z-index: 9999; user-select: none;
    }
    .dt-controls button {
      background: transparent; border: 1px solid rgba(255,255,255,.28);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center; padding: 0;
      transition: background .15s, opacity .15s;
    }
    .dt-controls button:hover { background: rgba(255,255,255,.12); }
    .dt-controls button:disabled { opacity: 0.25; cursor: default; }
    .dt-controls .dt-dots { display: flex; gap: 6px; }
    .dt-controls .dt-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.32); cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .dt-controls .dt-dot.is-active { background: #fff; transform: scale(1.15); }
    .dt-controls .dt-counter {
      font-size: 12px; letter-spacing: 0.14em; font-weight: 600;
      min-width: 48px; text-align: center;
    }

    body.export-mode .dt-controls { display: none !important; }
    body.export-mode .dt-carousel {
      display: block; padding: 0; gap: 0; overflow: visible;
      height: auto; scroll-snap-type: none;
    }
    body.export-mode section[data-slide] { box-shadow: none; }

    /* ====================================================================
       Estilos comuns às sections do estilo DIVIDIDO (_rascunho).
       Replicam o conteúdo do <head><style> de slide.html.
    ==================================================================== */
    section[data-slide] {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #b3b3b3;
      --color-photo-placeholder-top: #1a1a1a;
      --color-photo-placeholder-bottom: #262626;
      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;
      --text-shadow-strong:
        0 4px 16px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.45);

      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    section[data-slide] *, section[data-slide] *::before, section[data-slide] *::after {
      box-sizing: border-box;
    }
    section[data-slide] .slide {
      width: 1080px; height: 1350px; position: relative;
      display: flex; flex-direction: column; background: var(--color-bg);
    }
    section[data-slide] .half {
      position: relative; width: 1080px; height: 675px;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      padding: 0 80px; text-align: center;
    }
    section[data-slide] .half.top { background-color: var(--color-photo-placeholder-top); }
    section[data-slide] .half.bottom { background-color: var(--color-photo-placeholder-bottom); }
    section[data-slide] .half.top[data-has-bg] { filter: grayscale(0.85) contrast(1.05); }
    section[data-slide] .half.bottom[data-has-bg] { filter: contrast(1.08) saturate(1.05); }
    section[data-slide] .half::before {
      content: attr(data-label);
      position: absolute; top: 24px; left: 24px;
      font-family: var(--font-body); font-weight: 600; font-size: 14px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.22); pointer-events: none;
    }
    section[data-slide] .half[data-has-bg]::before { display: none; }
    section[data-slide] .half-text {
      position: relative; z-index: 2;
      font-family: var(--font-display); font-weight: 400; color: var(--color-fg);
      text-transform: uppercase; line-height: 0.95; letter-spacing: -0.005em;
      text-shadow: none; max-width: 920px;
    }
    section[data-slide] .half.top .half-text { font-size: 90px; }
    section[data-slide] .half.bottom .half-text { font-size: 90px; }
    section[data-slide] .brand-stamp {
      position: absolute; left: 0; right: 0; bottom: 36px; text-align: center;
      z-index: 5; font-family: var(--font-body); font-weight: 600; font-size: 14px;
      letter-spacing: 0.42em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: none;
      pointer-events: none;
    }
    section[data-slide] .slide.capa .half.top .half-text { font-size: 90px; }
    section[data-slide] .slide.capa .half.bottom .half-text { font-size: 90px; }
    section[data-slide] .slide.cta .half.bottom {
      background-color: var(--color-bg); filter: none;
    }
    section[data-slide] .slide.cta .half.bottom::before { display: none; }
    section[data-slide] .slide.cta .half.bottom .half-text {
      text-shadow: none; font-size: 90px;
    }
    section[data-slide] .slide.cta .cta-eyebrow {
      position: absolute; top: 110px; left: 0; right: 0; text-align: center;
      font-family: var(--font-body); font-weight: 600; font-size: 22px;
      letter-spacing: 0.32em; text-transform: uppercase;
      color: var(--color-muted); z-index: 3;
    }
  </style>
</head>
<body>
  <div class="dt-carousel" id="dt-carousel">

    <!-- ====== SLIDE 1 — CAPA ====== -->
    <section data-slide="1" style="width:1080px;height:1350px;">
      <div class="slide capa">
        <div class="half top" data-bg-drop="topo" data-label="[FOTO SUPERIOR]">
          <div class="half-text">O QUE NINGUÉM<br />TE FALA...</div>
        </div>
        <div class="half bottom" data-bg-drop="base" data-label="[FOTO INFERIOR]">
          <div class="half-text">SOBRE COSTAS EM V.</div>
        </div>
        <div class="brand-stamp">DINO TEAM</div>
      </div>
    </section>

    <!-- ====== SLIDE 2 — DIVIDIDO (instância A) ====== -->
    <section data-slide="2" style="width:1080px;height:1350px;">
      <div class="slide dividido">
        <div class="half top" data-bg-drop="topo" data-label="[FOTO SUPERIOR]">
          <div class="half-text">PARECE CHATO...</div>
        </div>
        <div class="half bottom" data-bg-drop="base" data-label="[FOTO INFERIOR]">
          <div class="half-text">MAS FUNCIONA.</div>
        </div>
        <div class="brand-stamp">DINO TEAM</div>
      </div>
    </section>

    <!-- ====== SLIDE 3 — DIVIDIDO (instância B) ====== -->
    <section data-slide="3" style="width:1080px;height:1350px;">
      <div class="slide dividido">
        <div class="half top" data-bg-drop="topo" data-label="[FOTO SUPERIOR]">
          <div class="half-text">DEMORA DEMAIS...</div>
        </div>
        <div class="half bottom" data-bg-drop="base" data-label="[FOTO INFERIOR]">
          <div class="half-text">ATÉ DAR RESULTADO.</div>
        </div>
        <div class="brand-stamp">DINO TEAM</div>
      </div>
    </section>

    <!-- ====== SLIDE 4 — CTA ====== -->
    <section data-slide="4" style="width:1080px;height:1350px;">
      <div class="slide cta">
        <div class="half top" data-bg-drop="topo" data-label="[FOTO SUPERIOR]">
          <div class="half-text">VOCÊ JÁ SABE...</div>
        </div>
        <div class="half bottom">
          <div class="half-text">COMECE HOJE.</div>
        </div>
        <div class="brand-stamp">DINO TEAM</div>
      </div>
    </section>

  </div>

  <div class="dt-controls" id="dt-controls">
    <button class="dt-prev" type="button" aria-label="Slide anterior">‹</button>
    <div class="dt-dots"></div>
    <button class="dt-next" type="button" aria-label="Próximo slide">›</button>
    <span class="dt-counter">1 / 1</span>
  </div>

  <script>
    (function () {
      "use strict";
      var carousel = document.getElementById("dt-carousel");
      var slides = Array.prototype.slice.call(carousel.querySelectorAll("section[data-slide]"));
      var total = slides.length; if (total === 0) return;
      var controls = document.getElementById("dt-controls");
      var prevBtn = controls.querySelector(".dt-prev");
      var nextBtn = controls.querySelector(".dt-next");
      var dotsEl = controls.querySelector(".dt-dots");
      var counterEl = controls.querySelector(".dt-counter");
      slides.forEach(function (_, i) {
        var d = document.createElement("span"); d.className = "dt-dot";
        d.addEventListener("click", function () { goTo(i); }); dotsEl.appendChild(d);
      });
      var dots = Array.prototype.slice.call(dotsEl.querySelectorAll(".dt-dot"));
      var current = 0;
      function update() {
        counterEl.textContent = (current + 1) + " / " + total;
        dots.forEach(function (d, i) { d.classList.toggle("is-active", i === current); });
        prevBtn.disabled = current === 0; nextBtn.disabled = current === total - 1;
      }
      function goTo(idx) {
        current = Math.max(0, Math.min(total - 1, idx));
        slides[current].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        update();
      }
      prevBtn.addEventListener("click", function () { goTo(current - 1); });
      nextBtn.addEventListener("click", function () { goTo(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); goTo(current + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current - 1); }
      });
      var st;
      carousel.addEventListener("scroll", function () {
        clearTimeout(st);
        st = setTimeout(function () {
          var c = carousel.scrollLeft + carousel.clientWidth / 2;
          var n = 0, m = Infinity;
          slides.forEach(function (s, i) {
            var sc = s.offsetLeft + s.offsetWidth / 2;
            var d = Math.abs(sc - c);
            if (d < m) { m = d; n = i; }
          });
          if (n !== current) { current = n; update(); }
        }, 80);
      });
      update();

      // Drop zones: [data-bg-drop] explícitas; fallback: slide inteiro
      slides.forEach(function (slide) {
        var zones = Array.prototype.slice.call(slide.querySelectorAll("[data-bg-drop]"));
        if (zones.length === 0) { slide.setAttribute("data-bg-drop", "full"); zones = [slide]; }
        zones.forEach(bindZone);
      });
      function bindZone(zone) {
        zone.addEventListener("dragover", function (e) { e.preventDefault(); zone.classList.add("dt-drop-active"); });
        zone.addEventListener("dragleave", function (e) { if (e.target === zone) zone.classList.remove("dt-drop-active"); });
        zone.addEventListener("drop", function (e) {
          e.preventDefault(); e.stopPropagation(); zone.classList.remove("dt-drop-active");
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (!f || f.type.indexOf("image/") !== 0) return;
          var r = new FileReader();
          r.onload = function () {
            zone.style.backgroundImage = "url(" + r.result + ")";
            zone.style.backgroundSize = "cover";
            zone.style.backgroundPosition = "50% 50%";
            zone.style.backgroundRepeat = "no-repeat";
            zone.setAttribute("data-has-bg", "1");
          };
          r.readAsDataURL(f);
        });
        var dragging = false, sx = 0, sy = 0, sp = { x: 50, y: 50 };
        function getPos() {
          var p = zone.style.backgroundPosition || "50% 50%";
          var pp = p.split(/\s+/); var x = parseFloat(pp[0]); var y = parseFloat(pp[1]);
          return { x: isNaN(x) ? 50 : x, y: isNaN(y) ? 50 : y };
        }
        zone.addEventListener("mousedown", function (e) {
          if (!zone.hasAttribute("data-has-bg")) return;
          e.preventDefault(); e.stopPropagation();
          dragging = true; sx = e.clientX; sy = e.clientY; sp = getPos();
          zone.classList.add("dt-grabbing");
        });
        document.addEventListener("mousemove", function (e) {
          if (!dragging) return;
          var dx = ((sx - e.clientX) / zone.offsetWidth) * 100;
          var dy = ((sy - e.clientY) / zone.offsetHeight) * 100;
          var nx = Math.max(0, Math.min(100, sp.x + dx));
          var ny = Math.max(0, Math.min(100, sp.y + dy));
          zone.style.backgroundPosition = nx.toFixed(1) + "% " + ny.toFixed(1) + "%";
        });
        document.addEventListener("mouseup", function () {
          if (dragging) { dragging = false; zone.classList.remove("dt-grabbing"); }
        });
      }
    })();
  </script>
</body>
</html>
