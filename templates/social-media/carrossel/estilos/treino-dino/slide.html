<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide Carrossel — Dino Team / treino-dino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ====================================================================
       BRAND DINO TEAM — Estilo treino-dino — carrossel 4:5 (1080x1350)

       Variantes (escolha uma na <section class="slide ...">):
         .slide.capa      → slide 1: foto Ramon + título grande + swipe cue
         .slide.lista     → slide 2: foto Ramon + lista de exercícios
         .slide.exercicio → slides 3 a N+2: chroma verde + canto com exercício
         .slide.cta       → slide final: foto Ramon + frase centralizada

       Tokens: paleta P&B + cinza, chroma green funcional, Anton + Montserrat
       Margem padrão: 80px. Não altere width/height.
    ==================================================================== */
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #7f7f7f;
      --color-chroma: #00b140;

      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;

      --pad: 80px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      color: var(--color-fg);
    }

    /* --------- Background fotográfico (capa, lista, cta) --------- */
    .slide-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-color: #1a1a1a; /* fallback enquanto a foto não está aplicada */
    }
    .slide-bg.placeholder {
      background-image: repeating-linear-gradient(
        45deg, #1a1a1a 0 24px, #222 24px 48px
      );
    }
    .img-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0) 55%,
        rgba(0,0,0,.7) 100%
      );
    }

    /* --------- Chroma key (slides de exercício) --------- */
    .chroma-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: var(--color-chroma);
    }

    /* --------- Topbar (logo + tag de tópico) --------- */
    .topbar {
      position: absolute;
      top: var(--pad);
      left: var(--pad);
      right: var(--pad);
      height: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 4;
    }
    .topbar .logo-img {
      width: 100px;
      height: auto;
      display: block;
      opacity: 0.98;
    }
    .topbar .topic {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,.92);
    }

    /* Em chroma, sem drop-shadow / text-shadow para não vazar verde */
    .slide.exercicio .topbar .logo-img,
    .slide.exercicio .topbar .topic,
    .slide.exercicio .exercise-corner * {
      filter: none;
      text-shadow: none;
    }

    /* --------- Barra de progresso (todos os slides) --------- */
    .progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 36px 80px 56px;
      z-index: 5;
    }
    .progress .track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.22);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    /* ============ VARIANTE: capa ============ */
    .slide.capa .title-block {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 var(--pad);
    }
    /* Modificadores opcionais de posicionamento */
    .slide.capa .title-block.align-left {
      align-items: flex-start;
      text-align: left;
    }
    .slide.capa .title-block.v-bottom {
      justify-content: flex-end;
      padding-bottom: 110px;
    }
    .slide.capa .big-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 160px;
      line-height: 0.92;
      letter-spacing: 0;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,.45);
    }
    .slide.capa .swipe-cue {
      margin-top: 22px;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      white-space: nowrap;
      font-family: var(--font-body);
      font-size: 26px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,.92);
    }
    .slide.capa .swipe-cue::after {
      content: "";
      display: inline-block;
      flex: 0 0 auto;
      width: max(10px, 0.60em);
      height: max(12px, 0.74em);
      background-color: currentColor;
      -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2012%2016'%3E%3Cpath%20d='M4%201L11%208L4%2015L1%2015L8%208L1%201Z'%20fill='%23000'/%3E%3C/svg%3E") no-repeat center / contain;
              mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2012%2016'%3E%3Cpath%20d='M4%201L11%208L4%2015L1%2015L8%208L1%201Z'%20fill='%23000'/%3E%3C/svg%3E") no-repeat center / contain;
    }

    /* ============ VARIANTE: lista ============ */
    .slide.lista .lista-content {
      position: absolute;
      inset: 0;
      z-index: 3;
      padding: 200px var(--pad) 110px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .slide.lista .ex-list {
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .slide.lista .ex-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .slide.lista .ex-item { display: flex; flex-direction: column; gap: 6px; }
    .slide.lista .img-overlay { display: none; }
    .slide.lista .ex-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0;
      color: #fff;
      line-height: 1.1;
    }
    .slide.lista .ex-name .code { margin-right: 10px; }
    .slide.lista .ex-reps {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 0;
      color: rgba(255,255,255,.92);
      display: flex;
      align-items: baseline;
      gap: 36px;
    }
    .slide.lista .ex-reps .sets { min-width: 130px; }
    .slide.lista .ex-reps .reps { display: flex; gap: 18px; }

    /* ============ VARIANTE: exercicio (chroma verde) ============ */
    .slide.exercicio .exercise-corner {
      position: absolute;
      left: var(--pad);
      bottom: 110px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 880px;
    }
    .slide.exercicio .ex-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 38px;
      letter-spacing: 0;
      color: #fff;
      line-height: 1.1;
    }
    .slide.exercicio .ex-name .code { margin-right: 10px; }
    .slide.exercicio .ex-reps {
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 30px;
      letter-spacing: 0;
      color: rgba(255,255,255,.95);
      display: flex;
      align-items: baseline;
      gap: 36px;
    }
    .slide.exercicio .ex-reps .sets { min-width: 150px; }
    .slide.exercicio .ex-reps .reps { display: flex; gap: 20px; }

    /* ============ VARIANTE: cta (final) ============ */
    .slide.cta .cta-block {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 0;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
    }
    .slide.cta .big-title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 140px;
      line-height: 0.95;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 4px 28px rgba(0,0,0,.5);
    }

    /* ---- Editor-ready: contêineres de layout (full-bleed, acima do fundo) não
       capturam o clique — assim o fundo continua selecionável para trocar
       foto/cor/gradiente. Só os slots e o próprio fundo capturam. Não afeta o
       export (pointer-events é ignorado na renderização do PNG). ---- */
    .title-block, .lista-content, .cta-block, .topbar, .exercise-corner { pointer-events: none; }
    [data-slot], .slide-bg, .chroma-bg { pointer-events: auto; }
  </style>
</head>
<body>
  <!--
    INSTRUÇÕES (para o Designer):
    1. Cada slide-N.html deve usar UMA das variantes:
       - slide-1.html  → <section class="slide capa">
       - slide-2.html  → <section class="slide lista">
       - slide-3.html..slide-(N+2).html → <section class="slide exercicio">
       - slide-(N+3).html → <section class="slide cta">

    2. A barra de progresso .fill width = (slide_atual / total_slides) * 100%

    3. Ajuste a tag .topic em cada slide:
       - capa: tema do treino (ex: "BACK DAY")
       - lista: "O TREINO"
       - exercicio 1, 2, 3...: "PRIMEIRO EXERCÍCIO", "SEGUNDO EXERCÍCIO"...
       - cta: frase de fechamento curta (ex: "DIRECIONE SEU ESFORÇO")

    4. Numeração dos exercícios: usar 1., 2., 3., ... (não A1., B1., C1.)
       Tanto no slide .lista quanto nos slides .exercicio.

    5. Reps separadas por <span> dentro de .reps. Use Ⓕ (U+24BB) para falha.

    5. Fundo de TODOS os slides é uma drop zone: o elemento de fundo leva
       data-bg-drop="photo" + data-slot="bg" + classe .placeholder. No Dino
       Editor, o painel "Fundo" alterna entre Foto / Cor / Gradiente. Nos slides
       .exercicio o fundo é o .chroma-bg (verde por padrão), também drop zone —
       o usuário pode trocar por foto do exercício ou outra cor/gradiente.

    6. Posicionamento do título na .capa: padrão é centralizado (horizontal + vertical).
       Modificadores opcionais na .title-block:
       - .align-left → alinha texto à esquerda
       - .v-bottom   → posiciona no rodapé (padding-bottom: 110px)
       Título e subtítulo ficam sempre juntos no mesmo bloco.

    7. Logo: img src deve apontar para brand/assets/logo.png (path relativo
       à pasta do post). Em preview standalone, pode usar caminho absoluto.

    8. Tagging para o editor (OBRIGATÓRIO p/ funcionar no Dino Editor):
       - a <section> leva data-block="<capa|lista|exercicio|cta>".
       - TODO elemento editável leva data-slot próprio (texto, logo, fundo...).
         Texto sem data-slot não é selecionável no editor.
       - o fundo (.slide-bg ou .chroma-bg) leva data-bg-drop="photo" + data-slot="bg".
       - contêineres de layout full-bleed (.title-block, .lista-content, .cta-block,
         .topbar, .exercise-corner) têm pointer-events:none no CSS, senão cobrem o
         fundo e impedem selecioná-lo. Só os slots capturam clique.

    Exemplo abaixo: variante .capa (apague e troque pela variante do slide).
  -->
  <section class="slide capa" data-block="capa">
    <div class="slide-bg placeholder" data-bg-drop="photo" data-slot="bg"></div>
    <div class="img-overlay" data-overlay></div>

    <div class="topbar">
      <img src="../../../../../brand/assets/logo.png" alt="DINO" class="logo-img" data-slot="logo" />
      <span class="topic" data-slot="tag-tópico">BACK DAY</span>
    </div>

    <div class="title-block">
      <h1 class="big-title" data-slot="título">TREINO PARA<br />COSTAS EM V</h1>
      <div class="swipe-cue" data-slot="swipe-cue">ARRASTE</div>
    </div>

    <div class="progress" data-slot="barra-progresso">
      <div class="track"><div class="fill" style="width: 11.11%"></div></div>
    </div>
  </section>

      <div class="chroma-bg placeholder" data-bg-drop="photo" data-slot="bg"></div>

</body>
</html>
