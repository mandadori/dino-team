<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Frame Stories — Dino Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ====================================================================
       BRAND DINO TEAM — stories Instagram 9:16 (1080x1920)
       Safe area: evite conteúdo crítico nos primeiros 250px e últimos 250px
       (espaço da UI do Instagram). Edite dentro de .frame.
    ==================================================================== */
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #b3b3b3;
      --color-accent: #f5f5f5;

      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;

      --safe-top: 250px;
      --safe-bottom: 250px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1920px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .frame {
      width: 1080px;
      height: 1920px;
      position: relative;
      padding: var(--safe-top) 90px var(--safe-bottom);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 40px;
    }

    /* --------- Tipografia base --------- */
    .eyebrow {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 30px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    h1.title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 180px;
      line-height: 0.92;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    h2.subtitle {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 110px;
      line-height: 0.95;
      text-transform: uppercase;
    }
    p.body {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 44px;
      line-height: 1.35;
    }
    p.body.muted { color: var(--color-muted); }

    /* --------- Variantes de frame --------- */
    .frame.hook { justify-content: flex-start; padding-top: 350px; }
    .frame.hook h1.title { font-size: 220px; }

    .frame.antes-depois {
      padding: 0;
      flex-direction: row;
      gap: 0;
    }
    .frame.antes-depois .half {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: var(--safe-top) 40px var(--safe-bottom);
      text-align: center;
      gap: 20px;
    }
    .frame.antes-depois .half + .half {
      background: var(--color-fg);
      color: var(--color-bg);
    }

    .frame.cta {
      justify-content: center;
      align-items: center;
      text-align: center;
      background: var(--color-fg);
      color: var(--color-bg);
    }

    /* --------- Marca --------- */
    .brand-tag {
      position: absolute;
      top: var(--safe-top);
      left: 90px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 26px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <!--
    INSTRUÇÕES:
    1. Escolha a variante trocando a classe: "hook", "antes-depois" ou "cta".
    2. Respeite a safe area (250px top/bottom) — UI do Instagram sobrepõe.
    3. Stories pede mensagem direta, alta densidade visual.
    4. Não altere o width/height — Puppeteer espera 1080x1920.
    5. data-bg-drop:
       - "hook" e "cta" → marque a raiz .frame com data-bg-drop="full".
       - "antes-depois" → cada .half recebe data-bg-drop="half" (são duas zonas).
  -->
  <section class="frame hook" data-bg-drop="full">
    <div class="brand-tag">DINO TEAM</div>
    <h1 class="title">Hook<br />direto</h1>
    <p class="body muted">Linha de apoio curta — máximo 12 palavras.</p>
  </section>
</body>
</html>
