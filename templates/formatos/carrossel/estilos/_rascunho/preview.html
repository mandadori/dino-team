<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Preview — _rascunho (foto-narrativa)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Wrapper Dino Team: carrossel arrastável + drop de imagem + reposicionamento */
    html, body { margin: 0; padding: 0; background: #111; overscroll-behavior: none; }

    .dt-carousel {
      display: flex; align-items: center; gap: 40px; padding: 0 40px;
      overflow-x: auto; overflow-y: hidden; height: 100vh;
      scroll-snap-type: x mandatory; scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .dt-carousel::-webkit-scrollbar { display: none; }

    section[data-slide] {
      flex-shrink: 0; scroll-snap-align: center; position: relative;
      overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.6);
    }

    [data-bg-drop].dt-drop-active { outline: 6px dashed #00b140; outline-offset: -6px; }
    [data-bg-drop][data-has-bg] { cursor: grab; }
    [data-bg-drop][data-has-bg].dt-grabbing { cursor: grabbing; }
    [data-bg-drop][data-has-bg]::after {
      content: "arrastar = reposicionar";
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      font: 600 10px/1 "Montserrat", sans-serif; letter-spacing: .08em;
      color: rgba(255,255,255,.7); background: rgba(0,0,0,.55);
      padding: 4px 10px; border-radius: 999px; pointer-events: none;
      white-space: nowrap; z-index: 10;
    }
    body.export-mode [data-bg-drop][data-has-bg]::after { display: none; }

    .dt-zoom-panel {
      display: none; align-items: center; gap: 6px;
      border-left: 1px solid rgba(255,255,255,.2); padding-left: 14px;
      font-size: 12px; font-weight: 600; letter-spacing: .06em;
    }
    .dt-zoom-panel.is-visible { display: flex; }
    .dt-zoom-panel input[type=number] {
      width: 58px; background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.28); color: #fff;
      border-radius: 6px; padding: 4px 6px; font: 700 12px "Montserrat", sans-serif;
      text-align: center; -moz-appearance: textfield; appearance: textfield;
    }
    .dt-zoom-panel input[type=number]::-webkit-inner-spin-button { opacity: 0.6; cursor: pointer; }

    .dt-controls {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 14px; padding: 10px 18px;
      background: rgba(0,0,0,.72); backdrop-filter: blur(10px);
      border-radius: 999px; font-family: "Montserrat", sans-serif;
      color: #fff; z-index: 9999; user-select: none;
    }
    .dt-controls button {
      background: transparent; border: 1px solid rgba(255,255,255,.28);
      color: #fff; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 20px; line-height: 1;
      display: flex; align-items: center; justify-content: center; padding: 0;
      transition: background .15s, opacity .15s;
    }
    .dt-controls button:hover { background: rgba(255,255,255,.12); }
    .dt-controls button:disabled { opacity: 0.25; cursor: default; }
    .dt-save {
      background: rgba(0,177,64,.18) !important; border-color: #00b140 !important;
      color: #00e051 !important; width: auto !important; padding: 0 14px !important;
      font-size: 12px !important; font-weight: 700; letter-spacing: .06em;
      white-space: nowrap; border-radius: 999px !important;
    }
    .dt-save:hover { background: rgba(0,177,64,.36) !important; }
    .dt-controls .dt-dots { display: flex; gap: 6px; }
    .dt-controls .dt-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,.32); cursor: pointer;
      transition: background .15s, transform .15s;
    }
    .dt-controls .dt-dot.is-active { background: #fff; transform: scale(1.15); }
    .dt-controls .dt-counter {
      font-size: 12px; letter-spacing: 0.14em; font-weight: 600;
      min-width: 48px; text-align: center;
    }

    body.export-mode .dt-controls { display: none !important; }
    body.export-mode .dt-carousel {
      display: block; padding: 0; gap: 0; overflow: visible;
      height: auto; scroll-snap-type: none;
    }
    body.export-mode section[data-slide] { box-shadow: none; }
  </style>
</head>
<body>
  <div class="dt-carousel" id="dt-carousel">

    <!-- ============ SLIDE 1: capa ============ -->
    <section data-slide="1" style="width:1080px;height:1350px;">
      <style>
        /* ESTILO: _rascunho | CONCEITO: foto full bleed + gradient bottom + logo+título em bloco v-bottom */
        #s1 { position:relative; width:1080px; height:1350px; overflow:hidden; color:#fff; font-family:"Montserrat","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
        #s1 * { box-sizing:border-box; margin:0; padding:0; }
        #s1 .slide-bg { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#1a1a1a; }
        #s1 .slide-bg.placeholder { background-image:repeating-linear-gradient(45deg,#1a1a1a 0 24px,#222 24px 48px); }
        #s1 .img-overlay { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0.15) 30%,rgba(0,0,0,0.95) 75%,rgba(0,0,0,1) 100%); }
        #s1 .title-block { position:absolute; left:80px; right:80px; z-index:3; bottom:200px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px; }
        #s1 .title-block .logo-img { height:36px; width:auto; display:block; opacity:0.98; margin-bottom:32px; }
        #s1 .big-title { font-family:"Anton","Impact",sans-serif; font-weight:400; font-size:140px; line-height:0.9; letter-spacing:0; text-transform:uppercase; color:#fff; }
        #s1 .swipe-cue { display:inline-flex; align-items:center; gap:10px; font-family:"Montserrat","Helvetica Neue",sans-serif; font-size:26px; font-weight:300; text-transform:uppercase; color:rgba(255,255,255,.92); }
        #s1 .swipe-cue svg { height:0.72em; width:auto; display:block; }
        #s1 .progress { position:absolute; left:0; right:0; bottom:0; padding:36px 80px 56px; z-index:5; }
        #s1 .progress .track { width:100%; height:3px; background:rgba(255,255,255,.22); border-radius:2px; overflow:hidden; }
        #s1 .progress .fill { height:100%; background:#ffffff; border-radius:2px; }
      </style>
      <div id="s1">

        <div class="img-overlay"></div>

        <div class="title-block">
          <img src="../../../../../brand/assets/logo.png" alt="DINO" class="logo-img" />
          <h1 class="big-title">DO ZERO<br>AO OLYMPIA</h1>
          <div class="swipe-cue">
            <span>ARRASTE</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <div class="progress">
          <div class="track"><div class="fill" style="width:33.33%"></div></div>
        </div>
      </div>
    </section>

    <!-- ============ SLIDE 2: corpo ============ -->
    <section data-slide="2" style="width:1080px;height:1350px;">
      <style>
        /* ESTILO: _rascunho | CONCEITO: foto full bleed + gradient bottom + logo centrada no topo + área editorial */
        #s2 { position:relative; width:1080px; height:1350px; overflow:hidden; color:#fff; font-family:"Montserrat","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
        #s2 * { box-sizing:border-box; margin:0; padding:0; }
        #s2 .slide-bg { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#1a1a1a; }
        #s2 .slide-bg.placeholder { background-image:repeating-linear-gradient(45deg,#1a1a1a 0 24px,#222 24px 48px); }
        #s2 .img-overlay { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0.15) 30%,rgba(0,0,0,0.95) 75%,rgba(0,0,0,1) 100%); }
        #s2 .logo-center { position:absolute; top:80px; left:0; right:0; z-index:4; display:flex; justify-content:center; align-items:center; pointer-events:none; }
        #s2 .logo-center .logo-img { height:36px; width:auto; display:block; opacity:0.98; }
        #s2 .content-area { position:absolute; left:80px; right:80px; z-index:3; bottom:160px; display:flex; flex-direction:column; gap:18px; }
        #s2 .eyebrow { font-family:"Montserrat","Helvetica Neue",sans-serif; font-size:13px; font-weight:500; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.6); line-height:1; }
        #s2 .headline { font-family:"Anton","Impact",sans-serif; font-weight:400; font-size:88px; line-height:0.92; letter-spacing:0; text-transform:uppercase; color:#ffffff; }
        #s2 .body-text { font-family:"Montserrat","Helvetica Neue",sans-serif; font-size:30px; font-weight:300; letter-spacing:0.01em; text-transform:uppercase; color:rgba(255,255,255,0.82); line-height:1.4; max-width:920px; }
        #s2 .swipe-wrap { position:absolute; left:80px; right:80px; bottom:80px; z-index:3; display:flex; justify-content:center; }
        #s2 .swipe-cue { display:inline-flex; align-items:center; gap:10px; font-family:"Montserrat","Helvetica Neue",sans-serif; font-size:26px; font-weight:300; text-transform:uppercase; color:rgba(255,255,255,.92); }
        #s2 .swipe-cue svg { height:0.72em; width:auto; display:block; }
        #s2 .progress { position:absolute; left:0; right:0; bottom:0; padding:36px 80px 56px; z-index:5; }
        #s2 .progress .track { width:100%; height:3px; background:rgba(255,255,255,.22); border-radius:2px; overflow:hidden; }
        #s2 .progress .fill { height:100%; background:#ffffff; border-radius:2px; }
      </style>
      <div id="s2">
        <div class="slide-bg placeholder" data-bg-drop="photo"></div>
        <div class="img-overlay"></div>

        <div class="logo-center">
          <img src="../../../../../brand/assets/logo.png" alt="DINO" class="logo-img" />
        </div>

        <div class="content-area">
          <span class="eyebrow">SEM ACADEMIA. SEM DINHEIRO.</span>
          <h2 class="headline">A PRIMEIRA<br>DECISÃO</h2>
          <p class="body-text">PLACEHOLDER — ATÉ 3 LINHAS DE TEXTO DE CORPO EM CAIXA ALTA. MÁXIMO 120 CARACTERES POR PARÁGRAFO.</p>
        </div>

        <div class="swipe-wrap">
          <div class="swipe-cue">
            <span>ARRASTE</span>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <div class="progress">
          <div class="track"><div class="fill" style="width:66.66%"></div></div>
        </div>
      </div>
    </section>

    <!-- ============ SLIDE 3: cta ============ -->
    <section data-slide="3" style="width:1080px;height:1350px;">
      <style>
        /* ESTILO: _rascunho | CONCEITO: foto full bleed + gradient bottom + logo+título em bloco v-bottom (padrão capa) */
        #s3 { position:relative; width:1080px; height:1350px; overflow:hidden; color:#fff; font-family:"Montserrat","Helvetica Neue",sans-serif; -webkit-font-smoothing:antialiased; }
        #s3 * { box-sizing:border-box; margin:0; padding:0; }
        #s3 .slide-bg { position:absolute; inset:0; z-index:0; background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#000; }
        #s3 .slide-bg.placeholder { background-image:repeating-linear-gradient(45deg,#0d0d0d 0 24px,#151515 24px 48px); }
        #s3 .img-overlay { position:absolute; inset:0; z-index:1; pointer-events:none; background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0.15) 30%,rgba(0,0,0,0.95) 75%,rgba(0,0,0,1) 100%); }
        #s3 .title-block { position:absolute; left:80px; right:80px; z-index:3; bottom:200px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px; }
        #s3 .title-block .logo-img { height:36px; width:auto; display:block; opacity:0.98; margin-bottom:32px; }
        #s3 .cta-headline { font-family:"Anton","Impact",sans-serif; font-weight:400; font-size:140px; line-height:0.9; letter-spacing:0; text-transform:uppercase; color:#ffffff; }
        #s3 .cta-sub { font-family:"Montserrat","Helvetica Neue",sans-serif; font-size:28px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:rgba(255,255,255,0.75); line-height:1.3; }
        #s3 .progress { position:absolute; left:0; right:0; bottom:0; padding:36px 80px 56px; z-index:5; }
        #s3 .progress .track { width:100%; height:3px; background:rgba(255,255,255,.22); border-radius:2px; overflow:hidden; }
        #s3 .progress .fill { height:100%; background:#ffffff; border-radius:2px; }
      </style>
      <div id="s3">
        <div class="slide-bg placeholder" data-bg-drop="photo"></div>
        <div class="img-overlay"></div>

        <div class="title-block">
          <img src="../../../../../brand/assets/logo.png" alt="DINO" class="logo-img" />
          <h2 class="cta-headline">COMECE<br>AGORA</h2>
          <p class="cta-sub">CONSULTORIA DINO TEAM</p>
        </div>

        <div class="progress">
          <div class="track"><div class="fill" style="width:100%"></div></div>
        </div>
      </div>
    </section>

  </div>

  <div class="dt-controls" id="dt-controls">
    <button class="dt-prev" type="button" aria-label="Slide anterior">‹</button>
    <div class="dt-dots"></div>
    <button class="dt-next" type="button" aria-label="Próximo slide">›</button>
    <span class="dt-counter">1 / 1</span>
    <div class="dt-zoom-panel" id="dt-zoom-panel">
      <span>Zoom</span>
      <input type="number" id="dt-zoom-input" min="25" max="800" step="1" value="100">
      <span>%</span>
    </div>
    <button class="dt-save" id="dt-save" type="button" aria-label="Salvar HTML com imagens">Salvar HTML</button>
  </div>

  <script>
    (function () {
      "use strict";
      var carousel = document.getElementById("dt-carousel");
      var slides = Array.prototype.slice.call(carousel.querySelectorAll("section[data-slide]"));
      var total = slides.length; if (total === 0) return;
      var controls = document.getElementById("dt-controls");
      var prevBtn = controls.querySelector(".dt-prev");
      var nextBtn = controls.querySelector(".dt-next");
      var dotsEl = controls.querySelector(".dt-dots");
      var counterEl = controls.querySelector(".dt-counter");
      slides.forEach(function (_, i) {
        var d = document.createElement("span"); d.className = "dt-dot";
        d.addEventListener("click", function () { goTo(i); }); dotsEl.appendChild(d);
      });
      var dots = Array.prototype.slice.call(dotsEl.querySelectorAll(".dt-dot"));
      var current = 0;
      function update() {
        counterEl.textContent = (current + 1) + " / " + total;
        dots.forEach(function (d, i) { d.classList.toggle("is-active", i === current); });
        prevBtn.disabled = current === 0; nextBtn.disabled = current === total - 1;
      }
      function goTo(idx) {
        current = Math.max(0, Math.min(total - 1, idx));
        slides[current].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
        update();
      }
      prevBtn.addEventListener("click", function () { goTo(current - 1); });
      nextBtn.addEventListener("click", function () { goTo(current + 1); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { e.preventDefault(); goTo(current + 1); }
        else if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current - 1); }
      });
      var st;
      carousel.addEventListener("scroll", function () {
        clearTimeout(st);
        st = setTimeout(function () {
          var c = carousel.scrollLeft + carousel.clientWidth / 2;
          var n = 0, m = Infinity;
          slides.forEach(function (s, i) {
            var sc = s.offsetLeft + s.offsetWidth / 2;
            var d = Math.abs(sc - c);
            if (d < m) { m = d; n = i; }
          });
          if (n !== current) { current = n; update(); }
        }, 80);
      });
      update();

      // Scaling: ajusta zoom de cada slide para caber na viewport; remove em export-mode
      function computeScale(slide) {
        var h = parseInt(slide.style.height, 10) || slide.offsetHeight;
        var w = parseInt(slide.style.width, 10) || slide.offsetWidth;
        if (!h || !w) return 1;
        return Math.min((window.innerHeight - 80) / h, (window.innerWidth - 80) / w, 1);
      }
      function applyScaling() {
        if (document.body.classList.contains("export-mode")) return;
        slides.forEach(function (s) { s.style.zoom = computeScale(s); });
      }
      function removeScaling() {
        slides.forEach(function (s) { s.style.zoom = ""; });
      }
      new MutationObserver(function () {
        if (document.body.classList.contains("export-mode")) removeScaling();
        else applyScaling();
      }).observe(document.body, { attributes: true, attributeFilter: ["class"] });
      applyScaling();
      window.addEventListener("resize", applyScaling);

      // Salvar HTML: serializa DOM atual (inline styles com base64) e dispara download
      document.getElementById("dt-save").addEventListener("click", function () {
        var title = document.title;
        var html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        var blob = new Blob([html], { type: "text/html;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = title.replace(/[^\w\s\-—()]/g, "").trim().replace(/\s+/g, " ") + ".html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      });

      // Zoom panel: input numérico na barra de controles
      var zoomPanel = document.getElementById("dt-zoom-panel");
      var zoomInput = document.getElementById("dt-zoom-input");
      var activeZone = null;

      function setActiveZone(zone) {
        activeZone = zone;
        zoomPanel.classList.add("is-visible");
        zoomInput.value = Math.round((zone._bgZoom || 1) * 100);
      }

      zoomInput.addEventListener("input", function () {
        if (!activeZone) return;
        var v = parseFloat(zoomInput.value);
        if (isNaN(v) || v < 1) return;
        activeZone._bgZoom = v / 100;
        applyBgZoom(activeZone);
      });
      // Impede que setas do teclado no input naveguem o carrossel
      zoomInput.addEventListener("keydown", function (e) { e.stopPropagation(); });

      // Drop zones: [data-bg-drop] explícitas; fallback: slide inteiro
      slides.forEach(function (slide) {
        var zones = Array.prototype.slice.call(slide.querySelectorAll("[data-bg-drop]"));
        if (zones.length === 0) { slide.setAttribute("data-bg-drop", "full"); zones = [slide]; }
        zones.forEach(bindZone);
      });

      // Retorna as dimensões CSS reais da zone no espaço de design (antes do zoom do slide)
      function getZoneDesignSize(zone) {
        var slide = zone.closest("section[data-slide]") || zone;
        var slideW = parseInt(slide.style.width, 10) || slide.offsetWidth;
        var slideH = parseInt(slide.style.height, 10) || slide.offsetHeight;
        var sr = slide.getBoundingClientRect();
        var zr = zone.getBoundingClientRect();
        return {
          w: slideW * (zr.width / sr.width),
          h: slideH * (zr.height / sr.height)
        };
      }

      // Aplica zoom na background-image sem tocar no layout
      function applyBgZoom(zone) {
        var bw = (zone._bgNatW * zone._bgScale * zone._bgZoom).toFixed(1);
        var bh = (zone._bgNatH * zone._bgScale * zone._bgZoom).toFixed(1);
        zone.style.backgroundSize = bw + "px " + bh + "px";
      }

      // Drag state global: 1 par de listeners no document para todas as zonas
      var dragState = null;
      function readPos(zone) {
        var p = zone.style.backgroundPosition || "50% 50%";
        var pp = p.split(/\s+/); var x = parseFloat(pp[0]); var y = parseFloat(pp[1]);
        return { x: isNaN(x) ? 50 : x, y: isNaN(y) ? 50 : y };
      }
      document.addEventListener("mousemove", function (e) {
        if (!dragState) return;
        var zone = dragState.zone;
        var rect = zone.getBoundingClientRect();
        var dx = ((dragState.sx - e.clientX) / rect.width) * 100;
        var dy = ((dragState.sy - e.clientY) / rect.height) * 100;
        var nx = Math.max(0, Math.min(100, dragState.sp.x + dx));
        var ny = Math.max(0, Math.min(100, dragState.sp.y + dy));
        zone.style.backgroundPosition = nx.toFixed(1) + "% " + ny.toFixed(1) + "%";
      });
      document.addEventListener("mouseup", function () {
        if (!dragState) return;
        dragState.zone.classList.remove("dt-grabbing");
        dragState = null;
      });

      function bindZone(zone) {
        zone.addEventListener("dragover", function (e) { e.preventDefault(); zone.classList.add("dt-drop-active"); });
        zone.addEventListener("dragleave", function (e) { if (e.target === zone) zone.classList.remove("dt-drop-active"); });
        zone.addEventListener("drop", function (e) {
          e.preventDefault(); e.stopPropagation(); zone.classList.remove("dt-drop-active");
          var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
          if (!f || f.type.indexOf("image/") !== 0) return;
          var r = new FileReader();
          r.onload = function () {
            var dataUrl = r.result;
            var img = new Image();
            img.onload = function () {
              var ds = getZoneDesignSize(zone);
              var scale = Math.max(ds.w / img.naturalWidth, ds.h / img.naturalHeight);
              zone._bgNatW = img.naturalWidth;
              zone._bgNatH = img.naturalHeight;
              zone._bgScale = scale;
              zone._bgZoom = 1.0;
              zone.style.backgroundImage = "url(" + dataUrl + ")";
              zone.style.backgroundRepeat = "no-repeat";
              zone.style.backgroundPosition = "50% 50%";
              applyBgZoom(zone);
              zone.setAttribute("data-has-bg", "1");
              setActiveZone(zone);
            };
            img.src = dataUrl;
          };
          r.readAsDataURL(f);
        });
        zone.addEventListener("mousedown", function (e) {
          if (!zone.hasAttribute("data-has-bg")) return;
          e.preventDefault(); e.stopPropagation();
          setActiveZone(zone);
          dragState = { zone: zone, sx: e.clientX, sy: e.clientY, sp: readPos(zone) };
          zone.classList.add("dt-grabbing");
        });
      }
    })();
  </script>
</body>
</html>
