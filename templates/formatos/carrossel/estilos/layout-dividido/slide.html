<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide Carrossel — Estilo Dividido (Dino Team)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ====================================================================
       BRAND DINO TEAM — carrossel Instagram 4:5 (1080x1350)
       Estilo: DIVIDIDO (50/50)
       Layout: duas metades horizontais com foto independente + frase Anton
               sobreposta, centralizada em ambos os eixos.
       Narrativa: tensão (topo, reticências) -> resolução (base, ponto final).
       Tokens: paleta P&B + cinzas, tipografia Anton (display) + Montserrat (stamp)
       NÃO altere width/height — Puppeteer espera 1080x1350.
    ==================================================================== */
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #b3b3b3;
      --color-photo-placeholder-top: #1a1a1a;
      --color-photo-placeholder-bottom: #262626;

      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;

      /* Sombra para legibilidade do texto sobre fotos */
      --text-shadow-strong:
        0 4px 16px rgba(0, 0, 0, 0.55),
        0 2px 6px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--color-bg);
    }

    /* --------- Metades 50/50 --------- */
    .half {
      position: relative;
      width: 1080px;
      height: 675px; /* exatos 50% de 1350 */
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 80px; /* margem lateral da marca */
      text-align: center;
    }

    /* Placeholder visual quando não há foto dropada (cinza com label). */
    .half.top {
      background-color: var(--color-photo-placeholder-top);
    }
    .half.bottom {
      background-color: var(--color-photo-placeholder-bottom);
    }

    /* Tratamento sutil: foto superior desaturada, inferior preservada.
       Aplicado via filter no pseudo-fundo do drop. Como o background é
       definido em [data-bg-drop] pelo wrapper, usamos filter no elemento. */
    .half.top[data-has-bg] {
      filter: grayscale(0.85) contrast(1.05);
    }
    .half.bottom[data-has-bg] {
      filter: contrast(1.08) saturate(1.05);
    }

    /* Marcadores de placeholder (visíveis somente sem foto). */
    .half::before {
      content: attr(data-label);
      position: absolute;
      top: 24px;
      left: 24px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.22);
      pointer-events: none;
    }
    .half[data-has-bg]::before { display: none; }

    /* --------- Tipografia das metades --------- */
    .half-text {
      position: relative;
      z-index: 2;
      font-family: var(--font-display);
      font-weight: 400;
      color: var(--color-fg);
      text-transform: uppercase;
      line-height: 0.95;
      letter-spacing: -0.005em;
      text-shadow: none;
      max-width: 920px;
    }

    /* Topo: frase de tensão */
    .half.top .half-text {
      font-size: 90px;
    }

    /* Base: frase de resolução */
    .half.bottom .half-text {
      font-size: 90px;
    }

    /* --------- Stamp DINO TEAM (rodapé) --------- */
    .brand-stamp {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 36px;
      text-align: center;
      z-index: 5;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      text-shadow: none;
      pointer-events: none;
    }

    /* --------- Variantes --------- */

    /* CAPA: mantém 50/50 com foto nas duas metades, mas o texto introduz
       o tema (sem oposição tensão/resolução). Frase inferior pode ser o
       título principal — destaque maior. */
    .slide.capa .half.top .half-text { font-size: 90px; }
    .slide.capa .half.bottom .half-text { font-size: 90px; }

    /* DIVIDIDO: variante principal. Tensão -> resolução. (estilo default) */

    /* CTA: quebra parcial — metade inferior vira preto sólido (sem foto)
       com CTA branco Anton centralizado. Metade superior segue com foto. */
    .slide.cta .half.bottom {
      background-color: var(--color-bg);
      filter: none;
    }
    .slide.cta .half.bottom::before { display: none; }
    .slide.cta .half.bottom .half-text {
      text-shadow: none;
      font-size: 90px;
    }
    /* Pequeno selo Montserrat acima do CTA gigante para apoio. */
    .slide.cta .cta-eyebrow {
      position: absolute;
      top: 110px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--color-muted);
      z-index: 3;
    }
  </style>
</head>
<body>
  <!--
    INSTRUÇÕES DE USO:

    1. Escolha a variante na <section> trocando a classe:
       - "slide capa"     -> primeiro slide (introdução do tema)
       - "slide dividido" -> variante principal (tensão -> resolução)
       - "slide cta"      -> último slide (foto em cima, preto sólido embaixo)

    2. Edite as duas frases (.half.top .half-text  e  .half.bottom .half-text).
       Regras narrativas:
       - Superior: tom "negativo / obstáculo / limitação", termina em "..."
       - Inferior: tom "verdade / virada", começa com "MAS" ou "ATÉ", termina em "."
       - Mantenha CAIXA ALTA sempre (Anton).
       - 1 linha cada (máx 2). Limite ~24 caracteres para a inferior caber bem.

    3. Zonas fotográficas:
       - [data-bg-drop="topo"] -> foto da metade superior (tratada B&P)
       - [data-bg-drop="base"] -> foto da metade inferior (cor preservada)
       O wrapper do preview.html aceita drag-and-drop de imagem em cada zona,
       e permite reposicionar arrastando a imagem dentro da zona.

    4. NÃO altere width/height (1080x1350).
    5. NÃO inclua barra de progresso, swipe cue, logo ou watermark — o estilo
       é minimalista: só as duas metades + texto + stamp "DINO TEAM".
  -->

  <!-- Variante principal: DIVIDIDO (tensão -> resolução) -->
  <section class="slide dividido">
    <div class="half top" data-bg-drop="topo" data-label="[FOTO SUPERIOR]">
      <div class="half-text">FRASE DE TENSÃO...</div>
    </div>
    <div class="half bottom" data-bg-drop="base" data-label="[FOTO INFERIOR]">
      <div class="half-text">MAS A VERDADE.</div>
    </div>
    <div class="brand-stamp">DINO TEAM</div>
  </section>
</body>
</html>
