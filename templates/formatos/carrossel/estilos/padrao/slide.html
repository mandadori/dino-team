<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Slide Carrossel — Dino Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    /* ====================================================================
       BRAND DINO TEAM — carrossel Instagram 4:5 (1080x1350)
       Tokens: paleta P&B + cinzas, tipografia Anton (títulos) + Montserrat
       Edite o conteúdo dentro de .slide. Não altere width/height.
    ==================================================================== */
    :root {
      --color-bg: #000000;
      --color-fg: #ffffff;
      --color-muted: #b3b3b3;
      --color-accent: #f5f5f5;
      --color-divider: #1a1a1a;

      --font-display: "Anton", "Impact", sans-serif;
      --font-body: "Montserrat", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1350px; }
    body {
      background: var(--color-bg);
      color: var(--color-fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .slide {
      width: 1080px;
      height: 1350px;
      position: relative;
      padding: 100px 90px;
      display: flex;
      flex-direction: column;
    }

    /* --------- Tipografia base --------- */
    .eyebrow {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 28px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    h1.title {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 180px;
      line-height: 0.92;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    h2.subtitle {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 110px;
      line-height: 0.95;
      text-transform: uppercase;
    }
    p.body {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 42px;
      line-height: 1.35;
      color: var(--color-fg);
    }
    p.body.muted { color: var(--color-muted); }

    /* --------- Variantes de slide --------- */
    .slide.capa { justify-content: flex-end; }
    .slide.capa h1.title { font-size: 220px; }

    .slide.corpo { justify-content: center; gap: 40px; }

    .slide.cta {
      justify-content: center;
      align-items: center;
      text-align: center;
      background: var(--color-fg);
      color: var(--color-bg);
    }
    .slide.cta h2.subtitle { color: var(--color-bg); }

    /* --------- Footer / marca --------- */
    .brand-footer {
      position: absolute;
      bottom: 70px;
      left: 90px;
      right: 90px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
    }
    .slide.cta .brand-footer { color: var(--color-bg); }

    /* --------- Indicador de página (opcional) --------- */
    .page-indicator {
      font-feature-settings: "tnum";
    }
  </style>
</head>
<body>
  <!--
    INSTRUÇÕES:
    1. Escolha a variante do slide trocando a classe: "capa", "corpo" ou "cta".
    2. Edite o conteúdo. Mantenha 1 ideia por slide.
    3. Capa: máx 12 palavras. Corpo: máx 40 palavras.
    4. Não altere o width/height — Puppeteer espera 1080x1350.
  -->
  <section class="slide capa">
    <div class="eyebrow">Pilar / categoria</div>
    <h1 class="title">Hook<br />em até<br />12 palavras</h1>

    <div class="brand-footer">
      <span>DINO TEAM</span>
      <span class="page-indicator">01</span>
    </div>
  </section>
</body>
</html>
